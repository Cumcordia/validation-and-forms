<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-4">Contact Us</h1>
            <form id="contactForm" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="name" class="form-label">Name</label>
                  <input type="text" class="form-control" id="name" required minlength="2">
                  <div class="valid-feedback">Looks good!</div>
                  <div class="invalid-feedback">Name is required (min 2 characters).</div>
                </div>
                <div class="col-md-6">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" required>
                  <div class="valid-feedback">Looks good!</div>
                  <div class="invalid-feedback">Email is required and must be valid.</div>
                </div>
                <div class="col-12">
                  <label for="message" class="form-label">Message</label>
                  <textarea class="form-control" id="message" rows="4" required minlength="10"></textarea>
                  <div class="valid-feedback">Looks good!</div>
                  <div class="invalid-feedback">Message is required (min 10 characters).</div>
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </div>
            </form>
            <div id="success" class="alert alert-success mt-3 d-none">Form submitted successfully!</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('contactForm');
    const fields = form.querySelectorAll('input, textarea');

    function check(field) {
      const ok = field.checkValidity();
      field.classList.toggle('is-valid', ok);
      field.classList.toggle('is-invalid', !ok);
      return ok;
    }

    fields.forEach(f => f.addEventListener('input', () => check(f)));

    form.addEventListener('submit', e => {
      e.preventDefault();
      let allValid = true;
      fields.forEach(f => { if (!check(f)) allValid = false; });
      document.getElementById('success').classList.toggle('d-none', !allValid);
    });
  </script>
</body>
</html>
